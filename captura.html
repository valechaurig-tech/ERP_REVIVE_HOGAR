<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Realidad virtual 360 — Revive Hogar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <style>
        :root { --teal: #1ee0a0; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: #050807; color: #fff; font-family: "Segoe UI", sans-serif; }
        button { font: inherit; cursor: pointer; }
        .primary { border: 0; border-radius: 999px; padding: 16px 18px; background: var(--teal); color: #04241c; font-weight: 800; font-size: 1.05rem; }
        .ghost { border: 0; border-radius: 999px; padding: 14px 16px; background: rgba(255,255,255,.14); color: #fff; font-weight: 700; }
        #start, #walk { min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 28px 22px 36px; }
        #start { background: radial-gradient(circle at 50% 18%, #16483c, #050807 62%); }
        #start[hidden], #walk[hidden], #cam[hidden], #vr[hidden] { display: none !important; }
        h1 { font-size: 1.8rem; margin: 0 0 8px; }
        p { color: #d5ebe4; line-height: 1.45; }
        #cam { position: fixed; inset: 0; background: #000; }
        #video, #ghost { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #ghost { pointer-events: none; }
        .shade { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at center, transparent 46%, rgba(0,0,0,.5) 100%); }
        #guide { position: absolute; left: 16px; right: 16px; top: 18px; margin: 0; text-align: center; font-weight: 800; font-size: 1.15rem; text-shadow: 0 2px 8px #000; }
        #sub { position: absolute; left: 20px; right: 20px; top: 78px; margin: 0; text-align: center; color: #fff; text-shadow: 0 1px 6px #000; }
        #reticle { position: absolute; left: 50%; top: 46%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border: 3px solid #fff; border-radius: 50%; display: grid; place-items: center; font-weight: 800; pointer-events: none; }
        #reticle.ready { border-color: var(--teal); box-shadow: 0 0 0 10px rgba(30,224,160,.28); }
        .edge { position: absolute; width: 0; height: 0; border-style: solid; filter: drop-shadow(0 2px 4px #000); opacity: 0; transition: opacity .15s; pointer-events: none; }
        .edge.show { opacity: 1; }
        #arr-r { right: 18px; top: 46%; border-width: 18px 0 18px 28px; border-color: transparent transparent transparent #fff; }
        #arr-l { left: 18px; top: 46%; border-width: 18px 28px 18px 0; border-color: transparent #fff transparent transparent; }
        #arr-u { left: 50%; top: 120px; margin-left: -18px; border-width: 0 18px 28px 18px; border-color: transparent transparent #fff transparent; }
        #arr-d { left: 50%; bottom: 130px; margin-left: -18px; border-width: 28px 18px 0 18px; border-color: #fff transparent transparent transparent; }
        .dock { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; justify-content: space-between; align-items: center; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); }
        .dock button { min-height: 52px; }
        #vr { position: fixed; inset: 0; background: #000; }
        #pano { position: absolute; inset: 0; }
        #vr .dock { pointer-events: none; }
        #vr .dock button, #vr .dpad button { pointer-events: auto; }
        .dpad { display: grid; grid-template-columns: 48px 48px 48px; grid-template-rows: 44px 44px; }
        .dpad button { border: 0; border-radius: 12px; background: rgba(0,0,0,.55); color: #fff; font-weight: 800; }
        .dpad .u { grid-column: 2; }
        .dpad .l { grid-column: 1; grid-row: 2; }
        .dpad .c { grid-column: 2; grid-row: 2; font-size: .75rem; }
        .dpad .r { grid-column: 3; grid-row: 2; }
        .dpad .d { grid-column: 2; grid-row: 3; }
        .dpad { grid-template-rows: 44px 44px 44px; }
    </style>
</head>
<body>
    <section id="start">
        <h1>360 del espacio</h1>
        <p>Pon el teléfono horizontal y da la vuelta completa. La app no deja las fotos en rebanadas: encaja lo que se repite entre una y la siguiente y construye una sola imagen de 360°. En la realidad virtual giras dentro de esa esfera.</p>
        <button type="button" class="primary" id="go">Abrir cámara</button>
    </section>

    <section id="cam" hidden>
        <video id="video" autoplay playsinline muted></video>
        <canvas id="ghost" hidden></canvas>
        <div class="shade"></div>
        <p id="guide">Preparando…</p>
        <p id="sub"></p>
        <div id="arr-u" class="edge"></div>
        <div id="arr-d" class="edge"></div>
        <div id="arr-l" class="edge"></div>
        <div id="arr-r" class="edge"></div>
        <div id="reticle">—</div>
        <div class="dock">
            <button type="button" class="ghost" id="skip-space">Saltar espacio</button>
            <button type="button" class="primary" id="shoot">Capturar</button>
        </div>
    </section>

    <section id="walk" hidden>
        <h1 id="walk-title">Espacio listo</h1>
        <p id="walk-text"></p>
        <button type="button" class="primary" id="next-space">Ya estoy en el siguiente espacio</button>
        <p></p>
        <button type="button" class="ghost" id="see-vr">Ver la realidad virtual</button>
    </section>

    <section id="vr" hidden>
        <div id="pano"></div>
        <div class="dock">
            <button type="button" class="ghost" id="again">Otra toma</button>
            <div class="dpad">
                <button type="button" class="u" data-p="10">↑</button>
                <button type="button" class="l" data-y="-15">←</button>
                <button type="button" class="c" id="gyro">Gyro</button>
                <button type="button" class="r" data-y="15">→</button>
                <button type="button" class="d" data-p="-10">↓</button>
            </div>
            <button type="button" class="primary" id="space-next">Otro espacio</button>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script>
        function labelFor(yaw) {
            const names = ["Frente", "Diagonal derecha", "Derecha", "Atrás derecha", "Atrás", "Atrás izquierda", "Izquierda", "Diagonal izquierda"];
            const i = Math.round((((yaw % 360) + 360) % 360) / 45) % 8;
            return names[i];
        }
        function lens() {
            const w = video.videoWidth || 1280;
            const h = video.videoHeight || 720;
            const landscape = w >= h;
            const hfov = landscape ? 69 : 50;
            return { hfov, vfov: hfov * (h / w), landscape };
        }
        function plan() {
            const { hfov, vfov, landscape } = lens();
            const step = Math.max(20, Math.min(32, hfov * 0.5));
            const count = Math.max(8, Math.round(360 / step));
            const yaws = [];
            for (let i = 0; i < count; i++) yaws.push((360 * i) / count);
            const steps = yaws.map(yaw => ({ yaw, pitch: 0, phase: "Alrededor", label: labelFor(yaw) }));
            const up = Math.min(48, vfov * 0.62);
            const ring = yaws.filter((_, i) => i % 2 === 0);
            ring.forEach(yaw => steps.push({ yaw, pitch: up, phase: "Techo", label: "Arriba · " + labelFor(yaw) }));
            ring.forEach(yaw => steps.push({ yaw, pitch: -up * 0.85, phase: "Piso", label: "Abajo · " + labelFor(yaw) }));
            steps.landscape = landscape;
            return steps;
        }

        const video = document.getElementById("video");
        const guideEl = document.getElementById("guide");
        const subEl = document.getElementById("sub");
        const reticle = document.getElementById("reticle");
        let mode = "start";
        let rawYaw = 0, rawPitch = 0, havePose = false;
        let yawSign = 1, pitchSign = 1;
        let refYaw = 0, refPitch = 0;
        let cal0 = null, pitch0 = null;
        let spaceIndex = 0;
        let stepIndex = 0;
        let steps = plan();
        let stableSince = 0;
        let spaces = [];
        let currentShots = [];
        let viewer = null;
        let sceneCursor = 0;
        let sawAbsolute = false;

        function mul(a, b) {
            return {
                x: a.x * b.w + a.w * b.x + a.y * b.z - a.z * b.y,
                y: a.y * b.w + a.w * b.y + a.z * b.x - a.x * b.z,
                z: a.z * b.w + a.w * b.z + a.x * b.y - a.y * b.x,
                w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z
            };
        }
        function eulerYXZ(x, y, z) {
            const c1 = Math.cos(x / 2), c2 = Math.cos(y / 2), c3 = Math.cos(z / 2);
            const s1 = Math.sin(x / 2), s2 = Math.sin(y / 2), s3 = Math.sin(z / 2);
            return {
                x: s1 * c2 * c3 + c1 * s2 * s3,
                y: c1 * s2 * c3 - s1 * c2 * s3,
                z: c1 * c2 * s3 - s1 * s2 * c3,
                w: c1 * c2 * c3 + s1 * s2 * s3
            };
        }
        function rotate(q, v) {
            const ix = q.w * v.x + q.y * v.z - q.z * v.y;
            const iy = q.w * v.y + q.z * v.x - q.x * v.z;
            const iz = q.w * v.z + q.x * v.y - q.y * v.x;
            const iw = -q.x * v.x - q.y * v.y - q.z * v.z;
            return {
                x: ix * q.w + iw * -q.x + iy * -q.z - iz * -q.y,
                y: iy * q.w + iw * -q.y + iz * -q.x - ix * -q.z,
                z: iz * q.w + iw * -q.z + ix * -q.y - iy * -q.x
            };
        }
        function poseFromEvent(e) {
            const deg = Math.PI / 180;
            const orient = (screen.orientation && screen.orientation.angle) || Number(window.orientation || 0);
            const alpha = (e.alpha || 0) * deg;
            const beta = (e.beta || 0) * deg;
            const gamma = (e.gamma || 0) * deg;
            let q = eulerYXZ(beta, alpha, -gamma);
            q = mul(q, { x: -Math.SQRT1_2, y: 0, z: 0, w: Math.SQRT1_2 });
            const oz = -orient * deg;
            q = mul(q, { x: 0, y: 0, z: Math.sin(oz / 2), w: Math.cos(oz / 2) });
            const f = rotate(q, { x: 0, y: 0, z: -1 });
            return {
                yaw: Math.atan2(f.x, -f.z) * 180 / Math.PI,
                pitch: Math.asin(Math.max(-1, Math.min(1, f.y))) * 180 / Math.PI
            };
        }
        function angDiff(a, b) {
            let d = a - b;
            while (d > 180) d -= 360;
            while (d < -180) d += 360;
            return d;
        }
        function viewYaw() { return angDiff(rawYaw, refYaw) * yawSign; }
        function viewPitch() { return (rawPitch - refPitch) * pitchSign; }

        function showOnly(id) {
            ["start", "cam", "walk", "vr"].forEach(key => {
                document.getElementById(key).hidden = key !== id;
            });
        }
        function setArrow(dir) {
            ["l", "r", "u", "d"].forEach(k => {
                document.getElementById("arr-" + k).classList.toggle("show", k === dir);
            });
        }
        function say(title, sub) {
            guideEl.textContent = title;
            subEl.textContent = sub || "";
        }

        function onOrient(e) {
            if (e.alpha == null && e.beta == null) return;
            const p = poseFromEvent(e);
            rawYaw = p.yaw;
            rawPitch = p.pitch;
            havePose = true;
            tick();
        }

        function beginSpace() {
            steps = plan();
            stepIndex = 0;
            currentShots = [];
            stableSince = 0;
            refYaw = rawYaw;
            refPitch = rawPitch;
            document.getElementById("ghost").hidden = true;
            mode = "capture";
            showOnly("cam");
            tick();
        }

        function current() { return steps[stepIndex]; }

        function tick() {
            if (mode === "cal-yaw") {
                setArrow("r");
                reticle.textContent = "→";
                say("Gira el cuerpo a tu derecha", "Despacio, sin caminar. El teléfono vertical, a la altura de los ojos.");
                if (!cal0 && havePose) cal0 = rawYaw;
                if (cal0 != null && Math.abs(angDiff(rawYaw, cal0)) > 28) {
                    yawSign = angDiff(rawYaw, cal0) > 0 ? 1 : -1;
                    mode = "cal-pitch";
                    pitch0 = null;
                    setArrow("u");
                }
                return;
            }
            if (mode === "cal-pitch") {
                setArrow("u");
                reticle.textContent = "↑";
                say("Ahora inclina hacia el techo", "Solo el teléfono, sin girar el cuerpo.");
                if (!pitch0 && havePose) pitch0 = rawPitch;
                if (pitch0 != null && Math.abs(rawPitch - pitch0) > 18) {
                    pitchSign = (rawPitch - pitch0) > 0 ? 1 : -1;
                    beginSpace();
                }
                return;
            }
            if (mode !== "capture" || !havePose) return;
            updateGhost();
            const t = current();
            if (!t) return;
            const dy = angDiff(t.yaw, viewYaw());
            const dp = t.pitch - viewPitch();
            const yawOk = Math.abs(dy) < 14;
            const pitchOk = Math.abs(dp) < 12;
            const n = stepIndex + 1;
            const where = "Espacio " + (spaceIndex + 1) + " · " + t.phase + " · " + n + "/" + steps.length + (lens().landscape ? "" : " · gira el teléfono a horizontal");
            reticle.classList.toggle("ready", yawOk && pitchOk);
            if (!yawOk) {
                setArrow(dy > 0 ? "r" : "l");
                reticle.textContent = Math.abs(Math.round(dy)) + "°";
                say(dy > 0 ? "Gira a tu derecha" : "Gira a tu izquierda", where + " · " + t.label + ghostHint());
                stableSince = 0;
                return;
            }
            if (!pitchOk) {
                setArrow(dp > 0 ? "u" : "d");
                reticle.textContent = Math.abs(Math.round(dp)) + "°";
                say(dp > 0 ? "Inclina hacia el techo" : "Inclina hacia el piso", where + " · " + t.label + ghostHint());
                stableSince = 0;
                return;
            }
            setArrow("");
            reticle.textContent = "OK";
            say("Quieto… alinea con la sombra", where + " · " + t.label);
            updateGhost();
            if (!stableSince) stableSince = Date.now();
            if (Date.now() - stableSince > 700) capture();
        }

        function grab() {
            const maxW = 960;
            const scale = Math.min(1, maxW / (video.videoWidth || maxW));
            const c = document.createElement("canvas");
            c.width = Math.max(2, Math.round((video.videoWidth || 640) * scale));
            c.height = Math.max(2, Math.round((video.videoHeight || 480) * scale));
            c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
            return c;
        }
        function capture() {
            const t = current();
            if (!t || !video.videoWidth) return;
            currentShots.push({ yaw: t.yaw, pitch: t.pitch, img: grab() });
            if (navigator.vibrate) navigator.vibrate(16);
            stepIndex += 1;
            stableSince = 0;
            if (stepIndex >= steps.length) finishSpace();
            else tick();
        }
        function finishSpace() {
            spaces.push({ title: "Espacio " + (spaceIndex + 1), shots: currentShots.slice() });
            mode = "walk";
            showOnly("walk");
            document.getElementById("walk-title").textContent = "Espacio " + (spaceIndex + 1) + " en 360";
            document.getElementById("walk-text").textContent = "El alrededor ya es una sola foto de 360°, no piezas sueltas. Puedes verla ahora, o caminar al siguiente cuarto, ponerte en el centro y empezar el espacio " + (spaceIndex + 2) + ".";
        }

        function ghostHint() {
            return document.getElementById("ghost").hidden ? "" : " · alinea la sombra";
        }
        function updateGhost() {
            const ghost = document.getElementById("ghost");
            const t = current();
            const prev = currentShots[currentShots.length - 1];
            if (!t || !prev) { ghost.hidden = true; return; }
            const vw = ghost.width = Math.max(2, window.innerWidth);
            const vh = ghost.height = Math.max(2, window.innerHeight);
            const g = ghost.getContext("2d");
            g.clearRect(0, 0, vw, vh);
            const img = prev.img;
            const dy = angDiff(t.yaw, prev.yaw);
            const dp = t.pitch - prev.pitch;
            const strip = 0.32;
            g.globalAlpha = 0.5;
            if (Math.abs(dy) >= Math.abs(dp) && Math.abs(dy) > 6) {
                if (dy > 0) g.drawImage(img, img.width * (1 - strip), 0, img.width * strip, img.height, 0, 0, vw * strip, vh);
                else g.drawImage(img, 0, 0, img.width * strip, img.height, vw * (1 - strip), 0, vw * strip, vh);
            } else if (dp > 6) {
                g.drawImage(img, 0, 0, img.width, img.height * strip, 0, vh * (1 - strip), vw, vh * strip);
            } else if (dp < -6) {
                g.drawImage(img, 0, img.height * (1 - strip), img.width, img.height * strip, 0, 0, vw, vh * strip);
            } else {
                ghost.hidden = true;
                return;
            }
            g.globalAlpha = 1;
            ghost.hidden = false;
        }
        function sampleBilinear(data, sw, sh, sx, sy) {
            const x0 = Math.max(0, Math.min(sw - 1, Math.floor(sx)));
            const y0 = Math.max(0, Math.min(sh - 1, Math.floor(sy)));
            const x1 = Math.min(sw - 1, x0 + 1);
            const y1 = Math.min(sh - 1, y0 + 1);
            const tx = sx - x0, ty = sy - y0;
            const i00 = (y0 * sw + x0) * 4, i10 = (y0 * sw + x1) * 4;
            const i01 = (y1 * sw + x0) * 4, i11 = (y1 * sw + x1) * 4;
            const mix = (a, b, t) => a + (b - a) * t;
            return [
                mix(mix(data[i00], data[i10], tx), mix(data[i01], data[i11], tx), ty),
                mix(mix(data[i00 + 1], data[i10 + 1], tx), mix(data[i01 + 1], data[i11 + 1], tx), ty),
                mix(mix(data[i00 + 2], data[i10 + 2], tx), mix(data[i01 + 2], data[i11 + 2], tx), ty)
            ];
        }
        function meanLum(img) {
            const d = img.getContext("2d").getImageData(0, 0, img.width, img.height).data;
            let s = 0, n = 0;
            for (let i = 0; i < d.length; i += 32) {
                s += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
                n++;
            }
            return s / Math.max(1, n);
        }
        function graySmall(img) {
            const h = 120;
            const w = Math.max(12, Math.round(img.width * (h / img.height)));
            const c = document.createElement("canvas");
            c.width = w;
            c.height = h;
            const ctx = c.getContext("2d", { willReadFrequently: true });
            ctx.drawImage(img, 0, 0, w, h);
            const d = ctx.getImageData(0, 0, w, h).data;
            const g = new Float32Array(w * h);
            for (let i = 0, p = 0; i < d.length; i += 4, p++) g[p] = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
            return { g, w, h, sx: img.width / w, sy: img.height / h };
        }
        function matchPair(a, b) {
            const minW = Math.min(a.w, b.w);
            const step = 2;
            function score(ov, dy) {
                if (ov < 8) return -2;
                let n = 0, sa = 0, sb = 0;
                for (let y = 4; y < a.h - 4; y += step) {
                    const yb = y + dy;
                    if (yb < 4 || yb >= b.h - 4) continue;
                    for (let x = 0; x < ov; x += step) {
                        sa += a.g[y * a.w + (a.w - ov + x)];
                        sb += b.g[yb * b.w + x];
                        n++;
                    }
                }
                if (n < 30) return -2;
                const ma = sa / n, mb = sb / n;
                let num = 0, da = 0, db = 0;
                for (let y = 4; y < a.h - 4; y += step) {
                    const yb = y + dy;
                    if (yb < 4 || yb >= b.h - 4) continue;
                    for (let x = 0; x < ov; x += step) {
                        const va = a.g[y * a.w + (a.w - ov + x)] - ma;
                        const vb = b.g[yb * b.w + x] - mb;
                        num += va * vb;
                        da += va * va;
                        db += vb * vb;
                    }
                }
                return num / Math.sqrt(da * db + 1e-6);
            }
            let best = { score: -2, ov: Math.round(minW * 0.35), dy: 0 };
            for (let ov = Math.floor(minW * 0.16); ov <= Math.floor(minW * 0.62); ov += 5) {
                for (let dy = -18; dy <= 18; dy += 3) {
                    const s = score(ov, dy);
                    if (s > best.score) best = { score: s, ov, dy };
                }
            }
            const o0 = best.ov, d0 = best.dy;
            for (let ov = o0 - 4; ov <= o0 + 4; ov++) {
                if (ov < 8 || ov > minW * 0.7) continue;
                for (let dy = d0 - 2; dy <= d0 + 2; dy++) {
                    const s = score(ov, dy);
                    if (s > best.score) best = { score: s, ov, dy };
                }
            }
            if (best.score < 0.12) best = { score: best.score, ov: Math.round(minW * 0.4), dy: 0 };
            return best;
        }
        function pasteFade(ctx, img, x, y, fadeLeft) {
            if (fadeLeft < 3) {
                ctx.drawImage(img, Math.round(x), Math.round(y));
                return;
            }
            const tmp = document.createElement("canvas");
            tmp.width = img.width;
            tmp.height = img.height;
            const t = tmp.getContext("2d");
            t.drawImage(img, 0, 0);
            t.globalCompositeOperation = "destination-in";
            const grd = t.createLinearGradient(0, 0, fadeLeft, 0);
            grd.addColorStop(0, "rgba(0,0,0,0)");
            grd.addColorStop(1, "rgba(0,0,0,1)");
            t.fillStyle = grd;
            t.fillRect(0, 0, fadeLeft, img.height);
            ctx.drawImage(tmp, Math.round(x), Math.round(y));
        }
        function stitchCylinder(shots) {
            const ordered = shots.slice().sort((a, b) => a.yaw - b.yaw);
            const small = ordered.map(s => graySmall(s.img));
            const links = ordered.map((_, i) => matchPair(small[i], small[(i + 1) % ordered.length]));
            const advances = ordered.map((s, i) => Math.max(8, s.img.width - links[i].ov * small[i].sx));
            const total = Math.round(advances.reduce((a, b) => a + b, 0));
            const ys = [];
            let y = 0;
            ordered.forEach((_, i) => {
                ys.push(y);
                const prev = (i + ordered.length - 1) % ordered.length;
                if (i > 0) y += links[prev].dy * small[prev].sy;
            });
            const minY = Math.min(...ys);
            const maxY = Math.max(...ys.map((v, i) => v + ordered[i].img.height));
            const pad = 8;
            const H = Math.round(maxY - minY + pad * 2);
            const close = Math.round(links[ordered.length - 1].ov * small[ordered.length - 1].sx);
            const wide = document.createElement("canvas");
            wide.width = total + Math.max(0, close);
            wide.height = H;
            const ctx = wide.getContext("2d");
            ctx.fillStyle = "#101614";
            ctx.fillRect(0, 0, wide.width, wide.height);
            let x = 0;
            ordered.forEach((s, i) => {
                const fade = i === 0 ? 0 : Math.round(links[i - 1].ov * small[i - 1].sx);
                pasteFade(ctx, s.img, x, ys[i] - minY + pad, fade);
                x += advances[i];
            });
            if (close > 4) {
                pasteFade(ctx, ordered[0].img, total, ys[0] - minY + pad, close);
                ctx.putImageData(ctx.getImageData(total, 0, close, H), 0, 0);
            }
            const cyl = document.createElement("canvas");
            cyl.width = Math.max(2, total);
            cyl.height = H;
            cyl.getContext("2d").drawImage(wide, 0, 0, total, H, 0, 0, total, H);
            return cyl;
        }
        function cylinderToEquirect(cyl) {
            const W = 2048, H = 1024;
            const vfov = Math.min(70, Math.max(36, lens().vfov)) * Math.PI / 180;
            const f = (cyl.height / 2) / Math.tan(vfov / 2);
            const src = cyl.getContext("2d").getImageData(0, 0, cyl.width, cyl.height);
            const out = document.createElement("canvas");
            out.width = W;
            out.height = H;
            const ctx = out.getContext("2d");
            const img = ctx.createImageData(W, H);
            const px = img.data;
            for (let y = 0; y < H; y++) {
                const pitch = ((H / 2 - (y + 0.5)) / (H / 2)) * (Math.PI / 2);
                const ys = cyl.height / 2 - f * Math.tan(pitch);
                for (let x = 0; x < W; x++) {
                    const o = (y * W + x) * 4;
                    if (ys < 0 || ys >= cyl.height - 1) {
                        px[o] = 8; px[o + 1] = 12; px[o + 2] = 11; px[o + 3] = 255;
                        continue;
                    }
                    const xs = (x / W) * (cyl.width - 1);
                    const x0 = Math.floor(xs), y0 = Math.floor(ys);
                    const tx = xs - x0, ty = ys - y0;
                    const x1 = Math.min(cyl.width - 1, x0 + 1);
                    const y1 = Math.min(cyl.height - 1, y0 + 1);
                    const i00 = (y0 * cyl.width + x0) * 4;
                    const i10 = (y0 * cyl.width + x1) * 4;
                    const i01 = (y1 * cyl.width + x0) * 4;
                    const i11 = (y1 * cyl.width + x1) * 4;
                    for (let k = 0; k < 3; k++) {
                        const a = src.data[i00 + k] + (src.data[i10 + k] - src.data[i00 + k]) * tx;
                        const b = src.data[i01 + k] + (src.data[i11 + k] - src.data[i01 + k]) * tx;
                        px[o + k] = a + (b - a) * ty;
                    }
                    px[o + 3] = 255;
                }
            }
            ctx.putImageData(img, 0, 0);
            const final = document.createElement("canvas");
            final.width = W;
            final.height = H;
            const g = final.getContext("2d");
            g.filter = "contrast(1.05) saturate(1.08)";
            g.drawImage(out, 0, 0);
            return final.toDataURL("image/jpeg", 0.88);
        }
        function sphereURL(shots) {
            const horizon = shots.filter(s => Math.abs(s.pitch) < 15);
            const ring = (horizon.length >= 2 ? horizon : shots).slice();
            if (ring.length < 2) return cylinderToEquirect(ring[0].img);
            return cylinderToEquirect(stitchCylinder(ring));
        }
        function showVR() {
            if (!spaces.length) return;
            document.getElementById("walk-text").textContent = "Uniendo las fotos en una sola esfera de 360°…";
            const half = Math.max(18, Math.min(40, lens().vfov * 0.42));
            const scenes = {};
            spaces.forEach((sp, i) => {
                const id = "e" + i;
                const next = "e" + ((i + 1) % spaces.length);
                scenes[id] = {
                    title: sp.title,
                    type: "equirectangular",
                    panorama: sp.url || (sp.url = sphereURL(sp.shots)),
                    yaw: 0,
                    pitch: 0,
                    hfov: 100,
                    hotSpots: spaces.length > 1 ? [{
                        pitch: -6, yaw: 0, type: "scene", text: "Siguiente espacio", sceneId: next
                    }] : []
                };
            });
            showOnly("vr");
            if (viewer) viewer.destroy();
            sceneCursor = 0;
            viewer = pannellum.viewer("pano", {
                default: {
                    firstScene: "e0",
                    autoLoad: true,
                    sceneFadeDuration: 700,
                    hfov: 100,
                    minPitch: -half,
                    maxPitch: half
                },
                scenes
            });
        }

        document.getElementById("go").onclick = async () => {
            const DOE = window.DeviceOrientationEvent;
            if (DOE && typeof DOE.requestPermission === "function") {
                try { await DOE.requestPermission(); } catch (err) { /* manual más adelante */ }
            }
            window.addEventListener("deviceorientationabsolute", e => { sawAbsolute = true; onOrient(e); }, true);
            window.addEventListener("deviceorientation", e => { if (!sawAbsolute) onOrient(e); });
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = stream;
                await video.play();
            } catch (err) {
                alert("No se pudo abrir la cámara. Acepta el permiso en el celular. " + (err.message || ""));
                return;
            }
            mode = "cal-yaw";
            cal0 = null;
            showOnly("cam");
            say("Gira el cuerpo a tu derecha", "Esperando el sensor del teléfono…");
            setTimeout(() => {
                if (mode === "cal-yaw" && !havePose) {
                    yawSign = 1;
                    pitchSign = 1;
                    beginSpace();
                    say("Sin sensor de giro", "Gira tú y pulsa Capturar en cada encuadre. La flecha dice hacia dónde.");
                }
            }, 4000);
        };
        document.getElementById("shoot").onclick = () => {
            if (mode === "cal-yaw" && havePose && cal0 != null) {
                yawSign = angDiff(rawYaw, cal0) >= 0 ? 1 : -1;
                mode = "cal-pitch";
                pitch0 = rawPitch;
                return;
            }
            if (mode === "cal-pitch") {
                if (pitch0 != null) pitchSign = (rawPitch - pitch0) >= 0 ? 1 : -1;
                beginSpace();
                return;
            }
            if (mode === "capture") capture();
        };
        document.getElementById("skip-space").onclick = () => {
            if (mode === "capture" && currentShots.length) finishSpace();
            else if (spaces.length) showVR();
        };
        document.getElementById("next-space").onclick = () => {
            spaceIndex += 1;
            if (spaceIndex > 3) { showVR(); return; }
            beginSpace();
        };
        document.getElementById("see-vr").onclick = () => showVR();
        document.getElementById("again").onclick = () => location.reload();
        document.getElementById("space-next").onclick = () => {
            if (!viewer || spaces.length < 2) return;
            sceneCursor = (sceneCursor + 1) % spaces.length;
            viewer.loadScene("e" + sceneCursor);
        };
        document.querySelector("#vr .dpad").onclick = e => {
            const b = e.target.closest("button");
            if (!b || !viewer) return;
            if (b.dataset.y) viewer.setYaw(viewer.getYaw() + Number(b.dataset.y));
            if (b.dataset.p) viewer.setPitch(viewer.getPitch() + Number(b.dataset.p));
        };
        document.getElementById("gyro").onclick = () => {
            if (!viewer) return;
            if (viewer.isOrientationActive && viewer.isOrientationActive()) viewer.stopOrientation();
            else viewer.startOrientation();
        };
    </script>
</body>
</html>
