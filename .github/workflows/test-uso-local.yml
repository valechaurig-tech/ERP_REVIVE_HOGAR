name: "Revive | QA de uso local"
on:
  pull_request:
    branches:
      - "work/responsive-redesign-2026-10-29"
    paths:
      - "js/usage-metrics.js"
      - "js/render.js"
      - "index.html"
      - "scripts/test-uso-local.mjs"
      - ".github/workflows/test-uso-local.yml"
permissions:
  contents: read
jobs:
  qa-metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/test-uso-local.mjs
